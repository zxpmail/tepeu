spring.main.web-application-type=none
spring.main.banner-mode=off

tepeu.data-dir=${user.home}/.tepeu

# DeepSeek 示例（key 用环境变量 OPENAI_API_KEY，勿提交密钥）：
# tepeu.family=openai
# tepeu.base-url=https://api.deepseek.com
# tepeu.model=deepseek-chat

# Ollama 示例：
# tepeu.family=openai
# tepeu.base-url=http://127.0.0.1:11434
# tepeu.model=llama3.2
# tepeu.api-key=ollama

tepeu.model=claude-sonnet-4-20250514
# 空 = 随 env key 推导；openai 且仍用上面 Anthropic 默认 model 时会改用 gpt-4o-mini
tepeu.family=
tepeu.base-url=
tepeu.api-key=
tepeu.principal-id=cli-user
tepeu.workspace-id=default
tepeu.fake-llm=false
tepeu.prompt-budget=8000
